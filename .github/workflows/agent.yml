name: AI Blog Agent

on:
  schedule:
    # Runs every 6 hours. To change frequency:
    #   Every 2 hours:  '0 */2 * * *'
    #   Every 12 hours: '0 */12 * * *'
    #   Once daily at 8am UTC: '0 8 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

# ── To switch LLM provider ────────────────────────────────────────────────────
# Go to: GitHub repo → Settings → Secrets and variables → Actions
#
# Secrets (sensitive):
#   LLM_API_KEY  →  your API key for whichever provider you choose
#
# Variables (non-sensitive, visible in logs):
#   LLM_PROVIDER →  gemini | anthropic | groq | deepseek | openai
#   LLM_MODEL    →  e.g. gemini-2.0-flash | claude-sonnet-4-6 | llama-3.3-70b-versatile
#
# Defaults (used when variables are not set): gemini / gemini-2.0-flash
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the draft post back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent
        run: python agent/run.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-2.0-flash' }}
          HN_MIN_SCORE: '100'
          MAX_AGE_HOURS: '48'

      - name: Commit draft post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'agent: new draft post [skip vercel]'
          file_pattern: content/posts/*.mdx agent/covered.json
