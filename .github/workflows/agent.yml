name: AI Blog Agent

on:
  schedule:
    # Runs every 6 hours. To change frequency:
    #   Every 2 hours:  '0 */2 * * *'
    #   Every 12 hours: '0 */12 * * *'
    #   Once daily at 8am UTC: '0 8 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

# ── LLM Fallback Chain Configuration ─────────────────────────────────────────
# The agent tries LLM 1 first. On any failure it falls through to LLM 2,
# then LLM 3. Keep LLM 1 & 2 as free-tier providers; LLM 3 as paid backup.
#
# Add these in: GitHub repo → Settings → Secrets and variables → Actions
#
# SECRETS (sensitive — never visible in logs):
#   LLM_1_API_KEY   →  API key for your primary LLM     (e.g. Gemini key)
#   LLM_2_API_KEY   →  API key for your secondary LLM   (e.g. Groq key)
#   LLM_3_API_KEY   →  API key for your paid fallback   (e.g. Anthropic key)
#
# VARIABLES (non-sensitive — visible in logs):
#   LLM_1_PROVIDER  →  gemini | groq | anthropic | deepseek | openai
#   LLM_1_MODEL     →  e.g. gemini-2.0-flash
#   LLM_2_PROVIDER  →  groq | gemini | anthropic | deepseek | openai
#   LLM_2_MODEL     →  e.g. llama-3.3-70b-versatile
#   LLM_3_PROVIDER  →  (leave blank if you don't want a paid fallback)
#   LLM_3_MODEL     →  e.g. claude-haiku-4-5-20251001
#
# Defaults (used when variables are not set):
#   LLM 1: gemini / gemini-2.0-flash        ← free
#   LLM 2: groq  / llama-3.3-70b-versatile  ← free
#   LLM 3: (disabled unless you set LLM_3_PROVIDER + LLM_3_API_KEY)
# ─────────────────────────────────────────────────────────────────────────────

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the draft post back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent
        run: python agent/run.py
        env:
          # LLM 1 — primary (free)
          LLM_1_API_KEY:  ${{ secrets.LLM_1_API_KEY }}
          LLM_1_PROVIDER: ${{ vars.LLM_1_PROVIDER || 'gemini' }}
          LLM_1_MODEL:    ${{ vars.LLM_1_MODEL    || 'gemini-2.0-flash' }}
          # LLM 2 — secondary fallback (free)
          LLM_2_API_KEY:  ${{ secrets.LLM_2_API_KEY }}
          LLM_2_PROVIDER: ${{ vars.LLM_2_PROVIDER || 'groq' }}
          LLM_2_MODEL:    ${{ vars.LLM_2_MODEL    || 'llama-3.3-70b-versatile' }}
          # LLM 3 — paid last resort (optional, disabled if key not set)
          LLM_3_API_KEY:  ${{ secrets.LLM_3_API_KEY }}
          LLM_3_PROVIDER: ${{ vars.LLM_3_PROVIDER || '' }}
          LLM_3_MODEL:    ${{ vars.LLM_3_MODEL    || '' }}
          # Images — free Unsplash API key (unsplash.com/developers)
          # If not set, posts are generated without cover/inline images.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # General
          HN_MIN_SCORE: '100'
          MAX_AGE_HOURS: '48'

      - name: Commit draft posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase on remote changes; --autostash handles agent-written untracked files
          git pull --rebase --autostash origin main
          git add content/posts/*.mdx agent/covered.json
          # Only commit+push if there are staged changes
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "agent: new draft posts [skip vercel]"
          git push origin main
